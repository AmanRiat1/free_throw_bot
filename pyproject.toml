[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-throw-bot"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "AmanRiat1", email = "amanriat777@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "atproto",
  "nba_api",
  "pandas",
  "pytz",
]

[project.urls]
Documentation = "https://github.com/AmanRiat1/free-throw-bot#readme"
Issues = "https://github.com/AmanRiat1/free-throw-bot/issues"
Source = "https://github.com/AmanRiat1/free-throw-bot"

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.version]
path = "src/free_throw_bot/__about__.py"
